[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-capabilities"
version = "0.1.0"
description = "Independent, modular capability layer for Agent-Core"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Agent Capabilities Team" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["src"]
addopts = "-ra -q"
testpaths = [
    "tests",
]
